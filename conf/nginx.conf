# conf/nginx.conf — srs_simple의 HLS 파일/플레이어 페이지 서빙 (CLAUDE.md §5.6 S11)
#
# srs_simple은 RTMP만 담당하고, hls_path(objs/hls)에 쓴 m3u8/ts와
# 플레이어 페이지(www/hls.html)의 HTTP 서빙은 외부 nginx가 담당한다.
# 원본 SRS의 hls_path 기본값이 ./objs/nginx/html인 것과 같은 배포 모델이다.
#
# 프로젝트 루트를 prefix로 실행한다 (아래 경로가 전부 프로젝트 루트 기준):
#   nginx -p "$(pwd)" -c conf/nginx.conf      # 시작 (데몬)
#   nginx -p "$(pwd)" -s quit                 # 종료
# runner.sh가 서버와 함께 자동으로 띄우고 내린다.

pid objs/nginx.pid;
error_log objs/nginx-error.log warn;

worker_processes 1;

events {
    worker_connections 128;
}

http {
    access_log off;

    # 임시 파일도 프로젝트 밑으로 (시스템 경로 권한 문제 방지).
    client_body_temp_path objs/nginx-temp;
    proxy_temp_path objs/nginx-temp;
    fastcgi_temp_path objs/nginx-temp;
    uwsgi_temp_path objs/nginx-temp;
    scgi_temp_path objs/nginx-temp;

    # MIME — 제거한 내장 서버의 srs_go_http_content_type과 동일한 서브셋.
    default_type application/octet-stream;
    types {
        text/html                     html;
        application/vnd.apple.mpegurl m3u8;
        video/MP2T                    ts;
    }

    server {
        listen 8080;

        # "/" → HLS 플레이어 페이지 (www/hls.html).
        location / {
            root www;
            index hls.html;
        }

        # m3u8/ts → hls_path(objs/hls).
        # CORS는 hls.js 같은 브라우저 플레이어용, no-cache는 라이브 m3u8 폴링용.
        location ~ \.(m3u8|ts)$ {
            root objs/hls;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control no-cache;
        }
    }
}
